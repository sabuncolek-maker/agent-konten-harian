name: Daily Quote Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Validate Python
        run: python -m compileall -q agent tools main.py

      - name: Run agent
        env:
          YTCLIP_API_KEY: ${{ secrets.YTCLIP_API_KEY }}
          YTCLIP_BASE_URL: https://ai-api.ytclip.org/v1
        run: python main.py

      - name: Persist memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/memory.json
          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "chore: persist agent memory"
            git push
          fi
