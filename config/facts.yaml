# Konfigurasi niche: FAKTA UNIK
# Cara pakai: python main.py --config config/facts.yaml
# Contoh niche kedua — bukti bahwa tambah niche = cukup bikin file config + modul di niches/facts/

niche: facts
description: "Konten fakta unik flora, fauna, dan alam Indonesia"

llm:
  # model: kosongkan ("") agar DINAMIS:
  #   1. pakai secret LLM_MODEL kalau diisi,
  #   2. kalau tidak, pakai default per provider (lihat agent/brain.py _DEFAULT_MODELS).
  # Isi manual hanya kalau niche ini butuh model khusus, misal "openai/gpt-oss-120b:free".
  model: ""
  temperature: 0.8
  max_tokens: 1500

pipeline:
  - research
  - generate
  - verify      # verifikasi: fakta harus masuk akal & tidak ngawur

# Gaya bahasa konten — ubah sesukamu tanpa sentuh kode.
# KENAPA ada di config: selera bahasa itu preferensi pribadi, bukan logika program.
style:
  tone: >-
    Bahasa Indonesia santai seperti ngobrol di tongkrongan tapi tetap sopan.
    Langsung ke inti, pakai "kamu", kalimat pendek-pendek. HINDARI bahasa
    formal/kaku seperti "dukung gerakan", "bagikan pendapatmu", "menerapkan
    semangat", "inspirasi lebih banyak". Slide terakhir: ajakan ringan seperti
    ngajak teman ngobrol, bukan pengumuman resmi. Contoh nada yang benar:
    "Gimana menurut kamu? Tulis di komentar ya 👇" — bukan "bagikan pendapatmu".

content:
  max_slides: 4
  min_words_per_slide: 10
  language: "id"
  caption_hashtags:
    - "#faktaunik"
    - "#floraindonesia"
    - "#faunaindonesia"

evaluation:
  min_score: 75
  max_retries: 3

memory:
  avoid_repeat_days: 30
