# Konfigurasi niche: KUTIPAN tokoh Indonesia
# Cara pakai: python main.py --config config/quotes.yaml
# Mau ganti niche? Cukup tunjuk ke file config lain, tidak perlu ubah kode!

niche: quotes
description: "Konten kutipan tokoh Indonesia yang relevan dengan kondisi saat ini"

# LLM yang dipakai untuk niche ini
llm:
  # model: kosongkan ("") agar DINAMIS:
  #   1. pakai secret LLM_MODEL kalau diisi,
  #   2. kalau tidak, pakai default per provider (lihat agent/brain.py _DEFAULT_MODELS).
  # Isi manual hanya kalau niche ini butuh model khusus, misal "openai/gpt-oss-120b:free".
  model: ""
  temperature: 0.7
  max_tokens: 3000  # dinaikkan Okt 2026: prompt bertambah (tone + aturan kutipan asli), 1500 bikin respons kepotong

# Arah riset topik — ubah sesukamu tanpa sentuh kode.
research:
  mood: "campuran"  # pilihan: "serius" | "ringan" | "campuran"
  # serius : isu sosial yang sedang relevan (pendidikan, kesetaraan, lingkungan, dll)
  # ringan : topik fun — kisah unik tokoh, fakta menarik, pelajaran hidup yang ringan
  # campuran: acak setiap run, kadang serius kadang ringan

# Bank kutipan terverifikasi — tokoh Indonesia saja atau campur internasional?
# KENAPA: kutipan tokoh internasional (Einstein, Gandhi, Mandela) terdokumentasi
# jauh lebih luas → LLM lebih jarang salah atribusi dibanding tokoh lokal.
quotes:
  scope: "campuran"  # pilihan: "indonesia" | "internasional" | "campuran"
  bank_file: "data/quotes_verified.json"

# Aturan pipeline: urutan langkah yang dijalankan orchestrator
# Setiap langkah = nama modul di niches/quotes/
pipeline:
  - research    # cari topik/isu yang sedang relevan
  - generate    # buat draf konten kutipan
  - verify      # verifikasi keaslian kutipan (konservatif: ragu = tolak)

# Gaya bahasa konten — ubah sesukamu tanpa sentuh kode.
# KENAPA ada di config: selera bahasa itu preferensi pribadi, bukan logika program.
style:
  tone: >-
    Bahasa Indonesia santai seperti ngobrol di tongkrongan tapi tetap sopan. Langsung ke inti, pakai "kamu", kalimat pendek-pendek.

    ADAB (wajib): Di kalimat NARASI, tokoh selalu disebut dengan panggilan hormat (Pak/Bu/Beliau). DILARANG nama langsung saja atau kata "dia". Benar: "Pak Habibie selalu...", "Beliau percaya...". Salah: "Habibie selalu...", "bikin dia ingat". PENGECUALIAN: pada ATRIBUSI kutipan (baris "— Nama"), SELALU pakai nama lengkap resmi ("— Ki Hajar Dewantara", bukan "— Pak Hajar").

    INFORMATIF (wajib): Setiap fakta/anekdot harus ada konteks waktu yang kasar — cukup seperti "sejak muda", "waktu kuliah", "masa kecil". Tidak perlu tahun persis, tapi DILARANG fakta gantung tanpa keterangan waktu sama sekali.

    BUMBU (pelengkap, bukan pengganti): selingi sentuhan puitis, filosofis, dan humor ringan yang sopan. Nada dasar tetap santai tongkrongan.

    HINDARI bahasa formal/kaku seperti "dukung gerakan", "bagikan pendapatmu", "menerapkan semangat", "inspirasi lebih banyak". Slide terakhir: ajakan ringan seperti ngajak teman ngobrol, bukan pengumuman resmi. Contoh nada yang benar: "Gimana menurut kamu? Tulis di komentar ya 👇" — bukan "bagikan pendapatmu".

# Batasan konten
content:
  max_slides: 5          # jumlah slide carousel
  min_words_per_slide: 8
  language: "id"         # bahasa konten
  caption_hashtags:
    - "#kutipan"
    - "#tokohindonesia"
    - "#motivasi"

# Verifikasi: coba ulang dengan tokoh lain kalau ditolak (ide A).
# KENAPA ada di config: jumlah percobaan itu kebijakan, bukan logika program.
verification:
  max_retries: 2  # total tokoh dicoba = 1 + 2 = 3

# Evaluasi: konten harus skor >= 75 baru boleh dipublish
evaluation:
  min_score: 75
  max_retries: 3         # coba ulang maksimal 3x kalau skor kurang

# Anti-duplikat: jangan pakai tokoh yang sudah dipakai N hari terakhir
memory:
  avoid_repeat_days: 30
